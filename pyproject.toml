[project]
name = "ida-pro-mcp"
dynamic = ["version"]
description = "Model Context Protocol server for deterministic IDA Pro analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "GrecAndrei" },
    { name = "can1357" },
    { name = "IDA Pro MCP Contributors" },
]
keywords = ["ida", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "tomli-w>=1.2.0",
    "yara-python>=4.5.4",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.0",
    "tiktoken>=0.8.0",
    "pyyaml>=6.0.3",  # tests/test_ci_workflows.py guards parse .github/workflows YAML
]

[project.urls]
Repository = "https://github.com/GrecAndrei/ida-pro-mcp"
Issues = "https://github.com/GrecAndrei/ida-pro-mcp/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "ida_pro_mcp._version.__version__" }

[project.scripts]
ida-pro-mcp = "ida_pro_mcp.host.server:main"
ida-pro-mcp-cli = "ida_pro_mcp.cli:main"
ida-pro-mcp-install = "ida_pro_mcp.installer.main:main"

# No [tool.pyright] section. The host dispatch/audit layer is deliberately
# untyped, so the checker reports ~800 errors in src/ida_pro_mcp/host/server
# alone and no CI job can gate on it; a baseline that large would be inert and
# immediately stale. Re-add type checking (with a baseline) once the central
# call_tool/_execute_tool/_session_action_* surface is annotated.

[tool.ruff]
exclude = ["src/ida_pro_mcp/ida_mcp/zeromcp/*.py"]
line-length = 200

[tool.ruff.lint]
# Star-imports from `._common` in IDA tool modules are deliberate (see
# src/ida_pro_mcp/ida_mcp/tools/_common.py). They inject ~60 IDA SDK + infra
# names per file. Refactoring 50+ tool files to explicit imports would risk
# breaking the IDA runtime, and ruff cannot statically resolve names through
# `import *` even when `__all__` is declared in the source module.
# RET (504/505/507/508/503) disabled: this project uses `elif action == "..."`
# chains as static contract markers in the IDA-side tool dispatch code.
# Auto-fixing elif→if would be a semantics-preserving but review-heavy refactor
# across ~240 sites; the chains are intentional, not a style slip.
ignore = [
    "UP006", "UP035",  # typing.Dict/List/Optional — codebase uses typing.* consistently; switching to built-ins is bikeshedding.
    "UP037",  # quoted-Literal action enums under `from __future__ import annotations`: the strings are VALUES (action names in the IDA dispatch contract), not forward refs — unquoting turns them into bare names and breaks the annotation. Newer ruff flags these; disable rather than scatter noqa.
    "RET504", "RET505", "RET507", "RET508", "RET503",
    "PLC0415",  # imports inside functions (validate against runtime state, IDA SDK presence, optional deps)
    "PIE790",  # unnecessary-placeholder (we use real names everywhere)
    # Subjective-style noise — none are actual bugs:
    "PLR2004",        # magic-value-comparison (sensible int literals in domain code)
    "ARG001", "ARG002", "ARG005",     # unused-arguments (wide dispatch signatures)
    "ARG003",         # unused-class-attribute (config dataclasses use defaults widely)
    "PLR0912", "PLR0913", "PLR0915", "PLR0911",   # complexity metrics (already bounded by pylint config)
    "PLR0917",        # too-many-positional-args
    "PLR1704",        # redefined-argument-from-local (mostly false positives)
    "PLR0402",        # manual-from-import (often intentional)
    "PLW1508",        # invalid-envvar-default (we use env-defaulted env fallbacks)
    "PLW1510",        # subprocess-run-without-check (deploy scripts)
    "PLW2901",        # redefined-loop-name
    "PLW0603",        # global-statement (file-scoped builders)
    "SIM102", "SIM108", "SIM110", "SIM112", "SIM113", "SIM116",   # nested if/else micro-rewrites (diff noise)
    "PLC0206",        # dict-index-missing-items (router-table false positives)
    "PLC0208",        # iteration-over-set (often intentional)
]

select = [
    "E", "F", "W",
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "PIE", # flake8-pie
    "ARG", # unused-arguments
    "PL",  # pylint
]

[tool.ruff.lint.isort]
known-first-party = ["ida_pro_mcp", "ida_mcp", "host", "tools"]
combine-as-imports = true
force-sort-within-sections = false

[tool.ruff.lint.pylint]
# The project has wide contract functions (large Literal action enums,
# comprehensive dispatch tables). The default thresholds flag otherwise-
# reasonable code. Bump to match the codebase's typical envelope.
max-branches = 25
max-returns = 12
max-statements = 80
max-args = 12
max-positional-args = 12
max-locals = 25

[tool.ruff.lint.per-file-ignores]
# IDA tool modules: tolerate star-import + long Annotated signatures.
"src/ida_pro_mcp/ida_mcp/tools/**/*.py" = [
    "I001",  # inline try-imports cause false-positive report
    "F403",  # undefined-local-with-import-star  (uses `from ._common import *`)
    "F405",  # undefined-local-with-import-star-usage
    "F722",  # forward-annotation-syntax-error (ruff can't see Annotated via star)
    "F821",  # undefined-name (same root cause)
    "E501",  # line-too-long (wide Annotated[Literal[...]] sigs)
    "PLC0415",  # import-outside-top-level  (runtime-decided IDA SDK imports)
    "PLR2004",  # magic-value-comparison   (IDA has many small-int constants)
    "B008",  # function-call-in-default-argument  (Annotated defaults)
    "UP006", "UP045",  # old typing.Dict/Optional — matching codebase style
    "E701",  # multiple-statements-on-one-line-colon  (one-line guard pattern)
    "E741",  # ambiguous-variable-name (we use `l` for local/loop vars heavily)
    "E702",  # semicolon multi-statement
    "SIM105",  # nested try-import fallback (Intentional try/except ImportError with pass)
]
# calc.py has tests that source-slice its `_calc_persist_capture` function
# and exec it with a minimal namespace. Don't introduce `contextlib` (or
# any other stdlib) inside such functions via SIM105/PIE810 auto-fixes.
"src/ida_pro_mcp/ida_mcp/tools/calc.py" = [
    "SIM105",  # suppressible-exception  (would add `with contextlib.suppress(...)`)
    "SIM110",  # open-file-with-context-handler
    "PIE810",  # multiple-starts-ends-with
]
# IDA tool runtime (server): same as tools.
"src/ida_pro_mcp/ida_mcp/**/*.py" = [
    "I001",
    "PLC0415",
    "PLR2004",
    "B008",
    "UP006", "UP045",
    "F403",  # `from ._common import *` lives in query_lang.py too
    "E701",
    "E702",
    "E741",
    "SIM105",  # nested try-import fallback (intentional try/except/pass)
]
# server_script.py runs in IDA's embedded interpreter; same relaxation.
"src/ida_pro_mcp/server_script.py" = [
    "E501", "E701",
]
# Tests can be lenient on a few style rules.
"tests/**/*.py" = [
    "E402",  # module-import-not-top  (sys.path tweaks before imports)
    "E501",
    "E701",  # one-line guards in test bodies
    "E702",  # semicolon multi-statement
    "E741",  # ambiguous `l` variables
    "PLR2004",
    "PLC0415",
    "F401",  # fixtures often import names just for side effects
    "ARG001", "ARG002", "ARG005",  # test helpers have unused args
    "PLR0912", "PLR0913", "PLR0915",  # tests can be long/complex
    "B011",  # asserts in tests
    "SIM115",  # long-lived NamedTemporaryFile handles in tests
]
# Autogenerated schema files.
"src/ida_pro_mcp/host/schemas*.py" = ["E501", "UP006", "UP045"]
"src/ida_pro_mcp/host/schemas_data.py" = ["E501", "UP006", "UP045"]
"scripts/**" = ["E501", "E741", "E702", "E722", "SIM115"]
# Long-lived file handles (subprocess pipe logs, audit trails) skip the
# context-manager rule.
"src/ida_pro_mcp/host/config.py" = ["SIM115"]
# core.py and vuln_db.py contain long anchor-pattern / pattern-database
# string literals that are tabular data, not source code.
"src/ida_pro_mcp/host/intelligence/core.py" = ["E501"]
"src/ida_pro_mcp/host/stores/vuln_db.py" = ["E501"]
# tool_registry.py, server_blackboard.py: tabular action/data arrays.
"src/ida_pro_mcp/host/server/tool_registry.py" = ["E501"]
"src/ida_pro_mcp/host/server/server_blackboard.py" = ["E501"]
# server.py IDAMCPServer definition now wrapped over 13 lines but the
# tool_registry.py long literals get a per-file exception instead.
"src/ida_pro_mcp/host/server/server.py" = ["E501"]
"src/ida_pro_mcp/host/server/server_response.py" = ["E501"]
"src/ida_pro_mcp/host/stores/truncation.py" = ["E501"]
"src/ida_pro_mcp/ida_mcp/mcp_http.py" = ["E501"]
"src/ida_pro_mcp/host/server/audit.py" = ["SIM115"]
"src/ida_pro_mcp/host/server/server_runtime.py" = ["SIM115"]
"src/ida_pro_mcp/ida_mcp/tools/debug.py" = ["SIM115"]
"src/ida_pro_mcp/ida_mcp/tools/patterns.py" = ["SIM115"]
"src/ida_pro_mcp/installer/runtime.py" = ["SIM115"]
".opencode/**" = ["E501", "F401", "E741", "SIM103", "B904", "E402"]
"install.py" = ["E402", "E701"]

[tool.pytest.ini_options]
pythonpath = ["src"]
timeout = 30
timeout_method = "thread"
testpaths = ["tests"]
markers = [
    "live_ida: starts a licensed IDA instance and performs real MCP integration testing",
]

[tool.setuptools.package-data]
"ida_pro_mcp.installer" = ["client_configs.json"]
