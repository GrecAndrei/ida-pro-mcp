[project]
name = "ida-pro-mcp"
version = "1.0.0"
description = "Model Context Protocol server for deterministic IDA Pro analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "GrecAndrei" },
    { name = "can1357" },
    { name = "IDA Pro MCP Contributors" },
]
keywords = ["ida", "mcp", "llm", "plugin"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "idapro>=0.0.7",
    "tomli-w>=1.0.0",
    "yara-python>=4.5.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
]

[project.urls]
Repository = "https://github.com/GrecAndrei/ida-pro-mcp"
Issues = "https://github.com/GrecAndrei/ida-pro-mcp/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
ida-pro-mcp = "ida_pro_mcp.server:main"
ida-pro-mcp-cli = "ida_pro_mcp.cli:main"
idalib-mcp = "ida_pro_mcp.idalib_server:main"
ida-pro-mcp-install = "ida_pro_mcp.installer.main:main"

[tool.pyright]
include = ["src/ida_pro_mcp"]

[tool.ruff]
exclude = ["src/ida_pro_mcp/ida_mcp/zeromcp/*.py"]

[tool.pytest.ini_options]
timeout = 30
timeout_method = "thread"
addopts = "--ignore=tests/test_mcp_comprehensive.py --ignore=tests/integration --ignore=tests/probes --ignore=tests/benchmarks"
