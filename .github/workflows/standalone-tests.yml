name: Standalone Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: standalone-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout ruff

      - name: Ruff lint check
        run: ruff check .

      - name: Verify generated tool docs are up to date
        run: |
          python scripts/check_schema_integrity.py
          python scripts/generate_tool_skills.py
          git diff --exit-code -- .agents/skills docs/TOOLS_REFERENCE.md

      - name: Run standalone test suite
        env:
          IDA_MCP_DISABLE_RATE_LIMIT: "1"
          IDA_MCP_POLICY_MODE: "permissive"
        run: python -m pytest -q
