name: Standalone Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: standalone-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Consume pyproject's [dependency-groups].dev (PEP 735, pip >= 25.1)
          # so new dev deps such as pyyaml — required by the workflow-guard
          # tests in tests/test_ci_workflows.py — reach CI instead of drifting.
          pip install -e . --group dev

      - name: Ruff lint check
        run: ruff check .

      - name: Verify generated tool docs are up to date
        run: |
          python scripts/check_schema_integrity.py
          python scripts/generate_tool_skills.py
          git diff --exit-code -- .agents/skills docs/TOOLS_REFERENCE.md

      - name: Run standalone test suite
        env:
          IDA_MCP_DISABLE_RATE_LIMIT: "1"
          IDA_MCP_POLICY_MODE: "permissive"
        # tests/integration requires a licensed IDA installation and is
        # exercised locally against live sessions; CI must not attempt to
        # spawn idat (each class would wait out its startup timeout).
        run: python -m pytest -q --ignore=tests/integration

  # Optional: Architecture A Phase 1 — exercise the host-side r2 engine
  # against a real Rizin install. Hermetic tests in the base matrix already
  # cover the engine with a fake-r2 shim; this job proves the real
  # subprocess contract (`rz -q -c`, `rz-bin -Ij/-ej`). The job is resilient:
  # if apt cannot provide rizin, the real-engine tests skip instead of failing.
  r2-real-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Install Rizin (best-effort)
        run: |
          sudo apt-get update
          sudo apt-get install -y rizin || echo "rizin unavailable; real-engine tests will skip"

      - name: Run r2 engine tests against real rz
        env:
          IDA_MCP_DISABLE_RATE_LIMIT: "1"
          IDA_MCP_POLICY_MODE: "permissive"
        run: |
          python -m pytest -q --ignore=tests/integration \
            tests/host/test_swarm_p09_r2_engine.py
