name: Native Backend Build

# Build the in-process llama.cpp retrieval backend (libmcp_llama.so +
# mcp_quantize) and smoke-test the artifacts.  This is the fast path the
# whole embedding/rerank pipeline uses by default, so a C++ break here is a
# retrieval outage — even though the Python suite still passes (it falls back
# to the HTTP backend).
#
# The llama.cpp source is pinned to the exact commit the current driver is
# built and tested against.  The canonical default lives in
# scripts/build_native_llama.sh (LLAMA_CPP_COMMIT); the check step below
# fails the build if this env pin drifts from it.  Bump both together with
# any driver change that needs a newer llama.cpp.

on:
  push:
    branches: [main, master]
    paths:
      - "src/ida_pro_mcp/native/**"
      - "scripts/build_native_llama.sh"
  pull_request:
    paths:
      - "src/ida_pro_mcp/native/**"
      - "scripts/build_native_llama.sh"
  workflow_dispatch:

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLAMA_CPP_COMMIT: "99111b19ce482f081e92ec6c6cdbe6a4c815c515"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLAMA_CPP_ROOT: ${{ runner.temp }}/llama.cpp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify llama.cpp pin matches build script
        run: |
          grep -q 'LLAMA_CPP_COMMIT="${LLAMA_CPP_COMMIT:-'$LLAMA_CPP_COMMIT'}"' scripts/build_native_llama.sh

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libgomp1

      - name: Clone llama.cpp (pinned)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp "$LLAMA_CPP_ROOT"
          git -C "$LLAMA_CPP_ROOT" fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C "$LLAMA_CPP_ROOT" checkout "$LLAMA_CPP_COMMIT"

      - name: Build trimmed library + quantizer
        run: |
          JOBS="$(nproc)" LLAMA_CPP_SRC="$LLAMA_CPP_ROOT" \
            ./scripts/build_native_llama.sh

      - name: Smoke-test libmcp_llama.so loads
        run: |
          python - <<'PY'
          import ctypes, glob, sys
          candidates = glob.glob('${{ runner.temp }}/llama.cpp/build-mcp/libmcp_llama.so') \
              + glob.glob('src/ida_pro_mcp/native/build/libmcp_llama.so')
          assert candidates, 'libmcp_llama.so not produced'
          lib = ctypes.CDLL(candidates[0])
          fn = lib.mcp_llama_version
          fn.restype = ctypes.c_char_p
          ver = fn().decode()
          assert ver, 'mcp_llama_version returned empty'
          print(f'OK: libmcp_llama.so loaded, version={ver!r}')
          PY

      - name: Smoke-test mcp_quantize
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LLAMA_CPP_ROOT/build-mcp/mcp_quantize"
          # mcp_quantize prints usage and exits 2 when invoked with no args.
          # Asserting that exact exit code is what catches a freshly built
          # binary that crashes or segfaults at startup — a bare pipeline to
          # `head` always reports success regardless of the real status.
          if out="$("$LLAMA_CPP_ROOT/build-mcp/mcp_quantize" 2>&1)"; then
            rc=0
          else
            rc=$?
          fi
          test "$rc" -eq 2 || { printf 'mcp_quantize exited %s (expected 2); output:\n%s\n' "$rc" "$out"; exit 1; }
          grep -q 'usage:' <<< "$out" || { printf 'expected usage output, got:\n%s\n' "$out"; exit 1; }
